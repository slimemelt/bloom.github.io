<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>one moment…</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;900&display=swap">
<style>
  :root { --u: calc(min(100vw, 520px) / 1047); }
  html, body { height: 100%; margin: 0; background: #fff; color: #000; font-family: "Londrina Solid", "Arial Narrow", sans-serif; }
  .rings { position: fixed; left: calc(50% - 1323.5 * var(--u)); top: calc(-150 * var(--u)); width: calc(2650 * var(--u)); pointer-events: none; }
  .hill { position: fixed; left: 0; bottom: 0; width: 100%; height: 30vh; pointer-events: none; }
  main { position: relative; min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; padding: 24px 24px 34vh; text-align: center; }
  img.mark { width: 64px; height: 64px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(56px, 14vw, 110px); font-weight: 900; line-height: .9; text-transform: lowercase; }
  h1 span { color: #ff5cf0; }
  p { max-width: 20em; margin: 0; font-size: clamp(22px, 5vw, 30px); font-weight: 400; line-height: 1.05; }
  a { display: block; margin-top: 12px; color: #ff5cf0; font-weight: 900; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; }
</style>
</head>
<body>
<img class="rings" src="/assets/img/rings-home.svg" alt="">
<img class="hill" src="/assets/img/hill.svg" alt="">
<main>
  <img class="mark" src="/assets/favicon.svg" alt="">
  <h1 id="title">one moment…</h1>
  <p id="detail"></p>
</main>
<script type="module">
  // GitHub Pages serves this file for any path that doesn't exist. If the path is a short link
  // saved in the admin (for example /discord), forward the visitor; otherwise show "not found".
  const API = "https://api.bloomnetworks.net";

  const host = location.hostname.replace(/^www\./, "");
  const path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").toLowerCase();

  function showNotFound() {
    document.title = "Page not found";
    document.title = "nothing here";
    document.getElementById("title").innerHTML = "nothing <span>here</span>";
    document.getElementById("detail").innerHTML = 'either this page was deleted or moved or ya don’t know where you’re going.<a href="/">take me home</a>';
  }

  async function findDestination() {
    const response = await fetch(`${API}/redirects`);
    if (!response.ok) throw new Error(`redirects failed (${response.status})`);
    const { redirects } = await response.json();
    return redirects.find((row) => row.host === host && row.path === path)?.url;
  }

  try {
    const destination = await findDestination();
    if (destination) location.replace(destination);
    else showNotFound();
  } catch {
    showNotFound();
  }
</script>
</body>
</html>
